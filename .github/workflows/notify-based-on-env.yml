name: env_notify

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [dev, prod]
        default: dev
      message:
        type: string
        required: false
        default: "deploy finished"

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}

    steps:
      - name: build message
        id: payload
        run: |
          ENV="${{ github.event.inputs.env }}"
          MSG="${{ github.event.inputs.message }}"

          # colors: greenish for dev, red for prod
          if [ "$ENV" = "prod" ]; then COLOR=16711680; ICON="🔥"; else COLOR=3447003; ICON="🧪"; fi

          # silly avatar and borat gif (this is embeddable on discord)
          AVATAR="https://avatars.githubusercontent.com/u/583231?v=4"
          BORAT="https://media.tenor.com/WwXY0KjiiCEAAAAC/borat-very-nice.gif"

          cat > body.json <<EOF
          {
            "username": "CI Pipeline",
            "avatar_url": "$AVATAR",
            "embeds": [
              {
                "title": "$ICON $MSG",
                "color": $COLOR,
                "image": {"url": "$BORAT"},
                "fields": [
                  {"name": "Repo", "value": "${{ github.repository }}", "inline": true},
                  {"name": "User", "value": "${{ github.actor }}", "inline": true},
                  {"name": "Ref", "value": "${{ github.ref }}", "inline": false}
                ]
              }
            ]
          }
          EOF

          echo "file=body.json" >> $GITHUB_OUTPUT

      - name: send
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d @"${{ steps.payload.outputs.file }}" \
            "$DISCORD_WEBHOOK_URL"
