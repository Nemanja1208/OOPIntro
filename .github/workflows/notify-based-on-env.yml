name: Notify-Based-On-Env-plus-DB

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [DEVELOPMENT, PRODUCTION]
        default: DEVELOPMENT
      message:
        type: string
        required: false
        default: "Deployment finished"

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}

    steps:
      - name: Build Discord payload
        id: payload
        run: |
          ENV="${{ github.event.inputs.env }}"
          MSG="${{ github.event.inputs.message }}"
          # colors, blue for dev, red for prod
          if [ "$ENV" = "PRODUCTION" ]; then COLOR=16711680; ICON="🔥"; else COLOR=3447003; ICON="🧪"; fi
          AVATAR="https://avatars.githubusercontent.com/u/583231?v=4"
          BORAT="https://i.imgur.com/iOyz5Lh.gif" # stable

          cat > body.json <<EOF
          {
            "username": "CI Pipeline",
            "avatar_url": "$AVATAR",
            "embeds": [
              {
                "title": "$ICON Deployment to $ENV ENV",
                "color": $COLOR,
                "thumbnail": {"url": "$BORAT"},
                "fields": [
                  {"name": "Repo", "value": "${{ github.repository }}", "inline": true},
                  {"name": "User", "value": "${{ github.actor }}", "inline": true},
                  {"name": "Ref", "value": "${{ github.ref }}", "inline": false}
                ]
              }
            ]
          }
          EOF
          echo "file=body.json" >> $GITHUB_OUTPUT

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d @"${{ steps.payload.outputs.file }}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Log to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          # Compose ISO timestamp
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Build Notion page payload
          cat > notion.json <<EOF
          {
            "parent": { "database_id": "$NOTION_DATABASE_ID" },
            "properties": {
              "Repo": {
                "title": [{ "text": { "content": "${{ github.repository }}" } }]
              },
              "Student": {
                "rich_text": [{ "text": { "content": "${{ github.actor }}" } }]
              },
              "Env": {
                "select": { "name": "${{ github.event.inputs.env }}" }
              },
              "Message": {
                "rich_text": [{ "text": { "content": "${{ github.event.inputs.message }}" } }]
              },
              "Run": { "number": ${{ github.run_id }} },
              "Commit": {
                "rich_text": [{ "text": { "content": "${{ github.sha }}" } }]
              },
              "Ref": {
                "rich_text": [{ "text": { "content": "${{ github.ref }}" } }]
              },
              "When": { "date": { "start": "$NOW" } }
            }
          }
          EOF

          # Send to Notion
          curl -sS -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d @notion.json \
            || { echo "Notion insert failed"; cat notion.json; exit 1; }


